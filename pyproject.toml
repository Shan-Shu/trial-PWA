[project]
name = "research-agent"
version = "0.4.4"
description = "基于 LangGraph 的多模型协作科研辅助 Agent（多模型编排/科研检索/PDF 解析）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.1",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pymupdf>=1.28.2",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tavily-python>=0.8.1",
    "uvicorn>=0.52.4",
    "wikipedia>=1.4.0",
]

[project.scripts]
research-agent = "research_agent:main"
research-agent-pipeline = "research_agent.pipeline:main"
research-agent-dashboard = "research_agent.dashboard.app:main"
research-agent-study = "research_agent.study.graph:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
