[project]
name = "research-desk"
version = "0.1.3"
description = "research-desk：PWA 可视化界面（Streamlit）× trial 研究引擎（LangGraph 多模型编排、科研检索、PDF 解析、动态本体）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.1",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pandas>=2.0.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.30.0",
    "tavily-python>=0.8.1",
    "uvicorn>=0.52.4",
    "wikipedia>=1.4.0",
]

[project.scripts]
# 主入口：Streamlit 界面（本项目的主角）
research-desk = "desk.app:main"
# 引擎侧保留的入口（可选：HTTP 数据面、流水线、研究图、日志跟随）
research-desk-api = "research_agent.dashboard.app:main"
research-desk-pipeline = "research_agent.pipeline:main"
research-desk-study = "research_agent.study.graph:main"
research-desk-logs = "research_agent.logging:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 本项目有两个顶层包：引擎（research_agent，从 trial 原样搬入）
# 与界面/适配层（desk，本项目新增）。
# 刻意不用 uv_build：它按项目名推导单个模块名（会去找 research_desk），
# 这个版本也不认 `module-names`，多顶层包要绕。hatchling 一行声明清楚。
packages = ["src/research_agent", "src/desk"]
